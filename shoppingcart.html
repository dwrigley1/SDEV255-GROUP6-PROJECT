<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Scheduler - Shopping Cart</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topnav">
    <a href="index.html">All Courses</a>
    <a href="contact.html">Contact Us</a>
    <a href="login.html">Logout</a>
  </div>

  <div class="main">
  <h1>Shopping Cart</h1>
  <ul id="cart-list"></ul>
  <button class="confirm-btn" onclick="confirmSchedule()">Confirm Schedule</button>
</div>

<div id="enrolled-list" class="main">
  <!-- enrolled courses will be inserted here -->
</div>

<script>
  function loadCart() {
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    const cartList = document.getElementById('cart-list');
    cartList.innerHTML = '';

    if (cart.length === 0) {
      const emptyMessage = document.createElement('p');
      emptyMessage.textContent = 'Shopping Cart is Empty!';
      cartList.appendChild(emptyMessage);
    } else {
      cart.forEach((course, index) => {
        const li = document.createElement('li');
        li.textContent = course + ' ';
        const removeBtn = document.createElement('button');
        removeBtn.textContent = 'Remove';
        removeBtn.onclick = () => removeCourse(index);
        li.appendChild(removeBtn);
        cartList.appendChild(li);
      });
    }
  }

  function removeCourse(index) {
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    cart.splice(index, 1);
    localStorage.setItem('cart', JSON.stringify(cart));
    loadCart();
  }

  function confirmSchedule() {
    alert('Schedule Confirmed!');
    localStorage.removeItem('cart');
    loadCart();
    loadEnrolledCourses();
  }

  async function loadEnrolledCourses() {
    const token = localStorage.getItem("token");
    const enrolledList = document.getElementById("enrolled-list");

    if (!token) return;

    enrolledList.innerHTML = "<p>Loading enrolled courses...</p>";

    try {
      const response = await fetch("https://sdev255-group6-project.onrender.com/api/coursesList", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token })
      });

      const courses = await response.json();
      enrolledList.innerHTML = "<h3>Enrolled Courses</h3>";

      if (!Array.isArray(courses) || courses.length === 0) {
        enrolledList.innerHTML += "<p>No enrolled courses.</p>";
        return;
      }

      const ul = document.createElement("ul");
      courses.forEach(course => {
        const li = document.createElement("li");
        li.textContent = `${course.name} (${course.credits} credits)`;
        ul.appendChild(li);
      });

      enrolledList.appendChild(ul);
    } catch (err) {
      console.error("Could not load enrolled courses:", err);
      enrolledList.innerHTML = "<p>Error loading enrolled courses.</p>";
    }
  }

  loadCart();
  loadEnrolledCourses(); 
</script>

  <footer class="footer">
    &copy; 2025 Group 6 Class Scheduler
  </footer>
</body>
</html>
